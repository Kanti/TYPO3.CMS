<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<div class="typo3-preview d-flex flex-column vh-100" data-preview-settings="{settings}">
    <div class="alert alert-warning m-0 rounded-0" role="status" data-preview-notice hidden data-notice-failed="{f:translate(key: 'backend.preview:notice.failed')}"></div>
    <iframe class="flex-grow-1 w-100 border-0" referrerpolicy="no-referrer" title="{f:translate(key: 'backend.preview:title')}" data-preview-frame></iframe>
</div>
</html>
