<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<typo3-backend-searchable-select label="{label}">
    <div class="btn-group">
        <button type="button" class="btn btn-sm btn-default dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">{label}</button>
        <ul class="dropdown-menu">
            <f:for each="{groups}" as="group">
            <li><h6 class="dropdown-header">{group.label}</h6></li>
            <f:for each="{group.options}" as="option">
            <li><a class="dropdown-item dropdown-item-spaced" href="#{option.value}" title="{option.label}"{f:if(condition: '{option.value} == {selected}', then: ' aria-selected="true"')}>{option.label}</a></li>
            </f:for>
            </f:for>
        </ul>
    </div>
</typo3-backend-searchable-select>

</html>
